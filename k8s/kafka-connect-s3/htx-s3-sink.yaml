apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: htx-s3-sink
  labels:
    strimzi.io/cluster: kafka-connect-s3
spec:
  class: io.confluent.connect.s3.S3SinkConnector
  config:
    topics.regex: raw\.htx\..*

    topics.dir: data/raw/htx

    rotate.interval.ms: 60000          # Rotate (commit & close) file every 60s
    flush.size: 2147483647              # Max records per file (effectively disabled; rotation is time-based)

    s3.bucket.name: trade-bots-farm
    storage.class: io.confluent.connect.s3.storage.S3Storage
    store.url: "http://seaweedfs-s3.trade-bots-farm.svc.cluster.local:8333"

    value.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter.schemas.enable: false
    format.class: io.confluent.connect.s3.format.json.JsonFormat
    s3.compression.type: gzip

    path.format: "'year='yyyy'/month='MM'/day='dd"

    partitioner.class: io.confluent.connect.storage.partitioner.TimeBasedPartitioner
    partition.duration.ms: 86400000     # One partition (directory) per day
    timestamp.extractor: Wallclock

    timezone: UTC
    locale: en-US